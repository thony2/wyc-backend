<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="./assets/favicon/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./assets/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="./assets/favicon/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="./assets/favicon/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="./assets/favicon/site.webmanifest" crossorigin="use-credentials">
    <title>West Yorkshire Carpets — Admin</title>
<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── VARIABLES ── */
:root {
    --slate:   #1C1D22;
    --red:     #c8102e;
    --white:   #ffffff;
    --cream:   #f5f0eb;
    --grey:    #6b7280;
    --border:  #e5e7eb;
    --success: #16a34a;
    --warn:    #d97706;
    --danger:  #dc2626;
    --radius:  8px;
    --shadow:  0 1px 3px rgba(0,0,0,0.12);
}

body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; color: var(--slate); font-size: 14px; }

/* ── LOGIN ── */
#login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--slate); }
.login-box { background:var(--white); padding:40px; border-radius:var(--radius); width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.login-box .logo { font-size:1.4rem; font-weight:700; color:var(--slate); margin-bottom:8px; }
.login-box .logo span { color:var(--red); }
.login-box p { color:var(--grey); margin-bottom:28px; font-size:0.85rem; }
.form-field { margin-bottom:16px; }
.form-field label { display:block; font-size:0.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--grey); margin-bottom:6px; }
.form-field input, .form-field select, .form-field textarea {
    width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:var(--radius);
    font-size:0.92rem; font-family:inherit; color:var(--slate); background:var(--white);
    transition: border-color .2s;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus {
    outline:none; border-color:var(--red);
}
.btn { display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:var(--radius); font-size:0.88rem; font-weight:600; cursor:pointer; border:none; transition:opacity .2s; }
.btn:hover { opacity:.88; }
.btn-primary { background:var(--red); color:var(--white); width:100%; justify-content:center; }
.btn-secondary { background:var(--cream); color:var(--slate); }
.btn-success { background:var(--success); color:var(--white); }
.btn-danger { background:var(--danger); color:var(--white); }
.btn-sm { padding:6px 12px; font-size:0.8rem; }

/* ── LAYOUT ── */
#app { display:none; }
.sidebar { position:fixed; left:0; top:0; bottom:0; width:220px; background:var(--slate); padding:24px 0; overflow-y:auto; z-index:100; }
.sidebar .brand { padding:0 20px 24px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:16px; }
.sidebar .brand-name { font-size:1rem; font-weight:700; color:var(--white); }
.sidebar .brand-sub { font-size:0.72rem; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:.1em; }
.nav-item { display:block; padding:10px 20px; color:rgba(255,255,255,.65); text-decoration:none; font-size:0.88rem; cursor:pointer; border-left:3px solid transparent; transition:all .15s; }
.nav-item:hover { background:rgba(255,255,255,.06); color:var(--white); }
.nav-item.active { background:rgba(200,16,46,.15); color:var(--white); border-left-color:var(--red); }
.nav-item .icon { margin-right:8px; width:16px; display:inline-block; text-align:center; }
.nav-divider { height:1px; background:rgba(255,255,255,.08); margin:12px 20px; }
.sidebar-footer { position:absolute; bottom:0; left:0; right:0; padding:16px 20px; border-top:1px solid rgba(255,255,255,.08); }
.sidebar-user { font-size:0.8rem; color:rgba(255,255,255,.5); margin-bottom:8px; }
.sidebar-user strong { color:var(--white); display:block; }

.main { margin-left:220px; min-height:100vh; }
.topbar { background:var(--white); border-bottom:1px solid var(--border); padding:0 24px; height:56px; display:flex; align-items:center; justify-content:space-between; }
.topbar h1 { font-size:1rem; font-weight:600; }
.content { padding:24px; }

/* ── STATS ── */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--white); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.stat-card .label { font-size:0.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--grey); margin-bottom:8px; }
.stat-card .value { font-size:2rem; font-weight:700; color:var(--slate); }
.stat-card.warn .value { color:var(--warn); }
.stat-card.danger .value { color:var(--danger); }

/* ── TABLE ── */
.card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:24px; }
.card-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.card-header h2 { font-size:0.95rem; font-weight:600; }
.card-body { padding:20px; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--grey); padding:10px 12px; border-bottom:2px solid var(--border); white-space:nowrap; }
td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:0.88rem; vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#fafafa; }
.badge { display:inline-block; padding:2px 8px; border-radius:100px; font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.badge-seller { background:#fef3c7; color:#92400e; }
.badge-sale    { background:#fee2e2; color:#991b1b; }
.badge-premium { background:#ede9fe; color:#5b21b6; }
.badge-new     { background:#d1fae5; color:#065f46; }
.badge-active  { background:#d1fae5; color:#065f46; }
.badge-inactive{ background:#f3f4f6; color:#6b7280; }
.stock-low  { color:var(--danger); font-weight:700; }
.stock-ok   { color:var(--success); }
.actions { display:flex; gap:6px; flex-wrap:wrap; }

/* ── TOOLBAR ── */
.toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.toolbar input, .toolbar select { padding:8px 12px; border:1.5px solid var(--border); border-radius:var(--radius); font-size:0.88rem; font-family:inherit; }
.toolbar input:focus, .toolbar select:focus { outline:none; border-color:var(--red); }
.toolbar input { min-width:200px; }

/* ── MODAL ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal { background:var(--white); border-radius:var(--radius); width:100%; max-width:600px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.modal-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { font-size:1rem; font-weight:600; }
.modal-close { background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--grey); line-height:1; }
.modal-body { padding:24px; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-row.three { grid-template-columns:1fr 1fr 1fr; }
.toggle-row { display:flex; align-items:center; gap:12px; padding:10px 0; }
.toggle-row label { font-size:0.88rem; color:var(--slate); cursor:pointer; }
input[type="checkbox"] { width:16px; height:16px; cursor:pointer; accent-color:var(--red); }

/* ── TOAST ── */
#toast { position:fixed; bottom:24px; right:24px; background:var(--slate); color:var(--white); padding:12px 20px; border-radius:var(--radius); font-size:0.88rem; box-shadow:0 4px 20px rgba(0,0,0,.2); z-index:9999; transform:translateY(100px); opacity:0; transition:all .3s; }
#toast.show { transform:translateY(0); opacity:1; }
#toast.success { background:var(--success); }
#toast.error   { background:var(--danger); }

/* ── RESPONSIVE ── */
@media (max-width:768px) {
    .sidebar { width:200px; transform:translateX(-100%); transition:transform .3s; }
    .sidebar.open { transform:translateX(0); }
    .main { margin-left:0; }
    .form-row, .form-row.three { grid-template-columns:1fr; }
    .stats-grid { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
    <div class="login-box">
        <div class="logo">West Yorkshire <span>Carpets</span></div>
        <p>Admin Panel — Staff Access Only</p>
        <div class="form-field">
            <label>Username</label>
            <input type="text" id="login-user" placeholder="username" autocomplete="username">
        </div>
        <div class="form-field">
            <label>Password</label>
            <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="login-error" style="color:var(--danger);font-size:.85rem;margin-bottom:12px;display:none;"></div>
        <button class="btn btn-primary" onclick="login()">Sign In</button>
    </div>
</div>

<!-- APP -->
<div id="app">
    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-name">WYC Admin</div>
            <div class="brand-sub">West Yorkshire Carpets</div>
        </div>
        <a class="nav-item active" onclick="showPage('dashboard')" data-page="dashboard"><span class="icon">📊</span> Dashboard</a>
        <a class="nav-item" onclick="showPage('products')" data-page="products"><span class="icon">📦</span> Products</a>
        <a class="nav-item" onclick="showPage('offers')" data-page="offers"><span class="icon">🏷️</span> Deals & Offers</a>
        <div class="nav-divider"></div>
        <a class="nav-item" onclick="showPage('audit')" data-page="audit"><span class="icon">📋</span> Audit Log</a>
        <a class="nav-item" onclick="showPage('settings')" data-page="settings"><span class="icon">⚙️</span> Settings</a>
        <div class="sidebar-footer">
            <div class="sidebar-user"><strong id="sidebar-username"></strong>Logged in</div>
            <button class="btn btn-secondary btn-sm" onclick="logout()" style="width:100%;justify-content:center;">Sign Out</button>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="main">
        <div class="topbar">
            <h1 id="page-title">Dashboard</h1>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-primary btn-sm" onclick="showPage('products');setTimeout(openAddProduct,100)" id="quick-add" style="display:none">+ Add Product</button>
            </div>
        </div>
        <div class="content" id="content"><!-- pages render here --></div>
    </div>
</div>

<!-- PRODUCT MODAL -->
<div id="product-modal" style="display:none;">
    <div class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Add Product</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="p-id">
                <div class="form-row">
                    <div class="form-field">
                        <label>Product Name *</label>
                        <input type="text" id="p-name" placeholder="e.g. Prestige Saxony">
                    </div>
                    <div class="form-field">
                        <label>Category *</label>
                        <select id="p-category">
                            <option value="carpets">Carpets</option>
                            <option value="vinyl">Vinyl</option>
                            <option value="laminate">Laminate</option>
                            <option value="wood">Wood</option>
                        </select>
                    </div>
                </div>
                <div class="form-row three">
                    <div class="form-field">
                        <label>Price (£/m²) *</label>
                        <input type="number" id="p-price" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>Was Price (£/m²)</label>
                        <input type="number" id="p-original-price" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>Stock Level</label>
                        <input type="number" id="p-stock" min="0" placeholder="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label>SKU</label>
                        <input type="text" id="p-sku" placeholder="e.g. C-001">
                    </div>
                    <div class="form-field">
                        <label>Subcategory</label>
                        <input type="text" id="p-subcat" placeholder="e.g. Saxony, Twist, LVT">
                    </div>
                </div>
                <div class="form-field">
                    <label>Image URL</label>
                    <input type="text" id="p-img" placeholder="https://...">
                </div>
                <div class="form-field">
                    <label>Description</label>
                    <textarea id="p-desc" rows="3" placeholder="Product description..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label>Badge Text</label>
                        <input type="text" id="p-badge" placeholder="e.g. Best Seller">
                    </div>
                    <div class="form-field">
                        <label>Badge Type</label>
                        <select id="p-badge-type">
                            <option value="">None</option>
                            <option value="seller">Best Seller</option>
                            <option value="sale">Sale</option>
                            <option value="premium">Premium</option>
                            <option value="new">New In</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label>Durability (1–5)</label>
                        <input type="number" id="p-durability" min="1" max="5" value="3">
                    </div>
                    <div class="form-field">
                        <label>Softness (1–5)</label>
                        <input type="number" id="p-softness" min="1" max="5" value="3">
                    </div>
                </div>
                <div class="form-field">
                    <label>Suitable Rooms (comma separated)</label>
                    <input type="text" id="p-rooms" placeholder="living, bedroom, hallway, stairs, kitchen, bathroom">
                </div>
                <div class="toggle-row">
                    <input type="checkbox" id="p-featured"><label for="p-featured">⭐ Featured Product</label>
                </div>
                <div class="toggle-row">
                    <input type="checkbox" id="p-deal"><label for="p-deal">🏷️ Mark as Deal</label>
                </div>
                <div class="toggle-row">
                    <input type="checkbox" id="p-active" checked><label for="p-active">✅ Active (visible on website)</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>
</div>

<!-- OFFER MODAL -->
<div id="offer-modal" style="display:none;">
    <div class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Create Deal / Offer</h3>
                <button class="modal-close" onclick="closeOfferModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-field">
                    <label>Product *</label>
                    <select id="o-product"></select>
                </div>
                <div class="form-field">
                    <label>Offer Name *</label>
                    <input type="text" id="o-name" placeholder="e.g. Summer Sale 20% Off">
                </div>
                <div class="form-field">
                    <label>Discounted Price (£/m²) *</label>
                    <input type="number" id="o-price" min="0" step="0.01" placeholder="0.00">
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label>Start Date *</label>
                        <input type="date" id="o-start">
                    </div>
                    <div class="form-field">
                        <label>End Date *</label>
                        <input type="date" id="o-end">
                    </div>
                </div>
                <div class="toggle-row">
                    <input type="checkbox" id="o-featured"><label for="o-featured">⭐ Feature on homepage</label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeOfferModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveOffer()">Save Offer</button>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
const API = '/api/admin';
let TOKEN = localStorage.getItem('wyc_token') || '';
let currentUser = JSON.parse(localStorage.getItem('wyc_user') || 'null');

/* ── AUTH ── */
async function login() {
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pass').value;
    const err = document.getElementById('login-error');
    err.style.display = 'none';
    try {
        const res = await fetch(`${API}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error; err.style.display = 'block'; return; }
        TOKEN = data.token;
        currentUser = data;
        localStorage.setItem('wyc_token', TOKEN);
        localStorage.setItem('wyc_user', JSON.stringify(data));
        showApp();
    } catch (e) { err.textContent = 'Connection error'; err.style.display = 'block'; }
}

function logout() {
    TOKEN = ''; currentUser = null;
    localStorage.removeItem('wyc_token');
    localStorage.removeItem('wyc_user');
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
}

function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('sidebar-username').textContent = currentUser?.username || '';
    showPage('dashboard');
}

document.getElementById('login-pass')?.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

/* ── AUTHENTICATED FETCH ── */
async function apiFetch(url, opts = {}) {
    const res = await fetch(url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}`, ...(opts.headers || {}) }
    });
    if (res.status === 401) { logout(); return null; }
    return res;
}

/* ── NAVIGATION ── */
function showPage(page) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
    document.getElementById('page-title').textContent =
        { dashboard:'Dashboard', products:'Products', offers:'Deals & Offers', audit:'Audit Log', settings:'Settings' }[page];
    document.getElementById('quick-add').style.display = page === 'products' ? 'flex' : 'none';
    const pages = { dashboard: renderDashboard, products: renderProducts, offers: renderOffers, audit: renderAudit, settings: renderSettings };
    if (pages[page]) pages[page]();
}

/* ── TOAST ── */
function toast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    setTimeout(() => t.className = '', 3000);
}

/* ── DASHBOARD ── */
async function renderDashboard() {
    document.getElementById('content').innerHTML = `<div style="text-align:center;padding:40px;color:var(--grey);">Loading...</div>`;
    const res = await apiFetch(`${API}/stats`);
    if (!res) return;
    const s = await res.json();
    document.getElementById('content').innerHTML = `
        <div class="stats-grid">
            <div class="stat-card"><div class="label">Active Products</div><div class="value">${s.total_products}</div></div>
            <div class="stat-card"><div class="label">Active Deals</div><div class="value">${s.active_deals}</div></div>
            <div class="stat-card ${s.low_stock > 0 ? 'warn' : ''}"><div class="label">Low Stock (&le;5)</div><div class="value">${s.low_stock}</div></div>
            <div class="stat-card"><div class="label">Total Enquiries</div><div class="value">${s.total_leads}</div></div>
        </div>
        ${s.low_stock_items.length ? `
        <div class="card">
            <div class="card-header"><h2>⚠️ Low Stock Alert</h2></div>
            <div class="card-body">
                <table><thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Action</th></tr></thead>
                <tbody>${s.low_stock_items.map(p => `
                    <tr>
                        <td>${p.name}</td>
                        <td><span class="badge badge-seller">${p.category_slug}</span></td>
                        <td class="stock-low">${p.stock_level}</td>
                        <td><button class="btn btn-secondary btn-sm" onclick="quickStock(${p.id},'${p.name}')">Update Stock</button></td>
                    </tr>`).join('')}
                </tbody></table>
            </div>
        </div>` : ''}
        <div class="card">
            <div class="card-header"><h2>Recent Activity</h2></div>
            <div class="card-body">
                ${s.recent_changes.length ? `<table><thead><tr><th>User</th><th>Action</th><th>When</th></tr></thead>
                <tbody>${s.recent_changes.map(l => `
                    <tr><td>${l.username}</td><td>${l.action} — ${l.table_name} #${l.record_id || '-'}</td><td>${l.created_at}</td></tr>
                `).join('')}</tbody></table>` : '<p style="color:var(--grey)">No activity yet.</p>'}
            </div>
        </div>`;
}

/* ── PRODUCTS ── */
let allProducts = [];
async function renderProducts() {
    document.getElementById('content').innerHTML = `<div style="text-align:center;padding:40px;color:var(--grey);">Loading...</div>`;
    const res = await apiFetch(`${API}/products`);
    if (!res) return;
    allProducts = await res.json();
    renderProductTable(allProducts);
}

function renderProductTable(products) {
    document.getElementById('content').innerHTML = `
        <div class="toolbar">
            <input type="text" placeholder="🔍 Search products..." oninput="filterProducts(this.value)" id="product-search">
            <select onchange="filterByCategory(this.value)">
                <option value="">All Categories</option>
                <option value="carpets">Carpets</option>
                <option value="vinyl">Vinyl</option>
                <option value="laminate">Laminate</option>
                <option value="wood">Wood</option>
            </select>
        </div>
        <div class="card">
            <div class="card-header">
                <h2>Products (${products.length})</h2>
                <button class="btn btn-primary btn-sm" onclick="openAddProduct()">+ Add Product</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Badges</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${products.map(p => `
                        <tr>
                            <td><strong>${p.name}</strong>${p.sku ? `<br><small style="color:var(--grey)">${p.sku}</small>` : ''}</td>
                            <td>${p.category_slug}</td>
                            <td>£${parseFloat(p.price).toFixed(2)}${p.original_price ? `<br><small style="text-decoration:line-through;color:var(--grey)">£${parseFloat(p.original_price).toFixed(2)}</small>` : ''}</td>
                            <td class="${p.stock_level <= 5 ? 'stock-low' : 'stock-ok'}">${p.stock_level} <button class="btn btn-secondary btn-sm" style="margin-left:4px" onclick="quickStock(${p.id},'${p.name}')">✏️</button></td>
                            <td><span class="badge ${p.is_active ? 'badge-active' : 'badge-inactive'}">${p.is_active ? 'Active' : 'Hidden'}</span></td>
                            <td>${p.is_featured ? '⭐' : ''}${p.is_deal ? '🏷️' : ''}${p.badge ? `<span class="badge badge-${p.badge_type}">${p.badge}</span>` : ''}</td>
                            <td class="actions">
                                <button class="btn btn-secondary btn-sm" onclick="editProduct(${p.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id},'${p.name}')">Delete</button>
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>`;
}

function filterProducts(query) {
    const q = query.toLowerCase();
    renderProductTable(allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q)));
}
function filterByCategory(cat) {
    renderProductTable(cat ? allProducts.filter(p => p.category_slug === cat) : allProducts);
}

/* ── PRODUCT MODAL ── */
function openAddProduct() {
    document.getElementById('modal-title').textContent = 'Add Product';
    document.getElementById('p-id').value = '';
    ['p-name','p-price','p-original-price','p-stock','p-sku','p-subcat','p-img','p-desc','p-badge','p-rooms'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('p-category').value = 'carpets';
    document.getElementById('p-badge-type').value = '';
    document.getElementById('p-durability').value = '3';
    document.getElementById('p-softness').value = '3';
    document.getElementById('p-featured').checked = false;
    document.getElementById('p-deal').checked = false;
    document.getElementById('p-active').checked = true;
    document.getElementById('p-stock').value = '0';
    document.getElementById('product-modal').style.display = 'block';
}

function editProduct(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modal-title').textContent = 'Edit Product';
    document.getElementById('p-id').value = p.id;
    document.getElementById('p-name').value = p.name || '';
    document.getElementById('p-category').value = p.category_slug || 'carpets';
    document.getElementById('p-price').value = p.price || '';
    document.getElementById('p-original-price').value = p.original_price || '';
    document.getElementById('p-stock').value = p.stock_level || 0;
    document.getElementById('p-sku').value = p.sku || '';
    document.getElementById('p-subcat').value = p.subcategory || '';
    document.getElementById('p-img').value = p.img_url || '';
    document.getElementById('p-desc').value = p.description || '';
    document.getElementById('p-badge').value = p.badge || '';
    document.getElementById('p-badge-type').value = p.badge_type || '';
    document.getElementById('p-durability').value = p.durability || 3;
    document.getElementById('p-softness').value = p.softness || 3;
    document.getElementById('p-featured').checked = !!p.is_featured;
    document.getElementById('p-deal').checked = !!p.is_deal;
    document.getElementById('p-active').checked = !!p.is_active;
    try { document.getElementById('p-rooms').value = JSON.parse(p.rooms||'[]').join(', '); } catch { document.getElementById('p-rooms').value = ''; }
    document.getElementById('product-modal').style.display = 'block';
}

async function saveProduct() {
    const id = document.getElementById('p-id').value;
    const name = document.getElementById('p-name').value.trim();
    const price = parseFloat(document.getElementById('p-price').value);
    if (!name) { toast('Product name is required', 'error'); return; }
    if (isNaN(price) || price < 0) { toast('Valid price is required', 'error'); return; }

    const roomsRaw = document.getElementById('p-rooms').value;
    const rooms = JSON.stringify(roomsRaw.split(',').map(r => r.trim()).filter(Boolean));
    const origPrice = document.getElementById('p-original-price').value;

    const payload = {
        name, price,
        category_slug: document.getElementById('p-category').value,
        subcategory:   document.getElementById('p-subcat').value || null,
        sku:           document.getElementById('p-sku').value || null,
        original_price: origPrice ? parseFloat(origPrice) : null,
        stock_level:   parseInt(document.getElementById('p-stock').value) || 0,
        description:   document.getElementById('p-desc').value || null,
        img_url:       document.getElementById('p-img').value || null,
        badge:         document.getElementById('p-badge').value || null,
        badge_type:    document.getElementById('p-badge-type').value || null,
        durability:    parseInt(document.getElementById('p-durability').value) || 3,
        softness:      parseInt(document.getElementById('p-softness').value) || 3,
        rooms,
        is_featured: document.getElementById('p-featured').checked ? 1 : 0,
        is_deal:     document.getElementById('p-deal').checked ? 1 : 0,
        is_active:   document.getElementById('p-active').checked ? 1 : 0,
    };

    const url   = id ? `${API}/products/${id}` : `${API}/products`;
    const method = id ? 'PUT' : 'POST';
    const res = await apiFetch(url, { method, body: JSON.stringify(payload) });
    if (!res) return;
    const data = await res.json();
    if (!res.ok) { toast(data.error, 'error'); return; }
    toast(id ? 'Product updated ✓' : 'Product created ✓');
    closeModal();
    renderProducts();
}

async function deleteProduct(id, name) {
    if (!confirm(`Hide "${name}" from the website?\n\nIt won't be deleted — you can restore it by editing.`)) return;
    const res = await apiFetch(`${API}/products/${id}`, { method: 'DELETE' });
    if (!res) return;
    toast('Product hidden from website ✓');
    renderProducts();
}

function closeModal() { document.getElementById('product-modal').style.display = 'none'; }

/* ── QUICK STOCK ── */
async function quickStock(id, name) {
    const val = prompt(`Update stock for:\n"${name}"\n\nEnter new stock level:`);
    if (val === null) return;
    const n = parseInt(val);
    if (isNaN(n) || n < 0) { toast('Invalid stock level', 'error'); return; }
    const res = await apiFetch(`${API}/products/${id}/stock`, { method: 'PATCH', body: JSON.stringify({ stock_level: n }) });
    if (!res) return;
    toast(`Stock updated to ${n} ✓`);
    renderProducts();
}

/* ── OFFERS ── */
async function renderOffers() {
    document.getElementById('content').innerHTML = `<div style="text-align:center;padding:40px;color:var(--grey);">Loading...</div>`;
    const res = await apiFetch(`${API}/offers`);
    if (!res) return;
    const offers = await res.json();
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('content').innerHTML = `
        <div class="card">
            <div class="card-header">
                <h2>Active Deals & Offers (${offers.length})</h2>
                <button class="btn btn-primary btn-sm" onclick="openAddOffer()">+ New Offer</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Product</th><th>Offer Name</th><th>Sale Price</th><th>Start</th><th>End</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody>
                        ${offers.length ? offers.map(o => {
                            const active = o.is_active && o.start_date <= today && o.end_date >= today;
                            return `<tr>
                                <td>${o.product_name}</td>
                                <td>${o.offer_name}</td>
                                <td>£${parseFloat(o.discounted_price).toFixed(2)}/m²</td>
                                <td>${o.start_date}</td>
                                <td>${o.end_date}</td>
                                <td><span class="badge ${active ? 'badge-active' : 'badge-inactive'}">${active ? 'Live' : 'Inactive'}</span></td>
                                <td><button class="btn btn-danger btn-sm" onclick="deleteOffer(${o.id})">Remove</button></td>
                            </tr>`;
                        }).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--grey);padding:32px">No offers yet. Click + New Offer to create one.</td></tr>'}
                    </tbody>
                </table>
            </div>
        </div>`;
}

async function openAddOffer() {
    const res = await apiFetch(`${API}/products`);
    if (!res) return;
    const products = await res.json();
    const sel = document.getElementById('o-product');
    sel.innerHTML = products.filter(p => p.is_active).map(p => `<option value="${p.id}">${p.name} (£${parseFloat(p.price).toFixed(2)})</option>`).join('');
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('o-start').value = today;
    document.getElementById('o-end').value = '';
    document.getElementById('o-name').value = '';
    document.getElementById('o-price').value = '';
    document.getElementById('o-featured').checked = false;
    document.getElementById('offer-modal').style.display = 'block';
}

async function saveOffer() {
    const payload = {
        product_id:       parseInt(document.getElementById('o-product').value),
        offer_name:       document.getElementById('o-name').value.trim(),
        discounted_price: parseFloat(document.getElementById('o-price').value),
        start_date:       document.getElementById('o-start').value,
        end_date:         document.getElementById('o-end').value,
        is_featured:      document.getElementById('o-featured').checked ? 1 : 0,
        is_active:        1,
    };
    if (!payload.offer_name || !payload.end_date || isNaN(payload.discounted_price)) {
        toast('Please fill in all required fields', 'error'); return;
    }
    const res = await apiFetch(`${API}/offers`, { method: 'POST', body: JSON.stringify(payload) });
    if (!res) return;
    const data = await res.json();
    if (!res.ok) { toast(data.error, 'error'); return; }
    toast('Offer created ✓');
    closeOfferModal();
    renderOffers();
}

async function deleteOffer(id) {
    if (!confirm('Remove this offer?')) return;
    await apiFetch(`${API}/offers/${id}`, { method: 'DELETE' });
    toast('Offer removed ✓');
    renderOffers();
}

function closeOfferModal() { document.getElementById('offer-modal').style.display = 'none'; }

/* ── AUDIT LOG ── */
async function renderAudit() {
    const res = await apiFetch(`${API}/audit`);
    if (!res) return;
    const logs = await res.json();
    document.getElementById('content').innerHTML = `
        <div class="card">
            <div class="card-header"><h2>Audit Log — Last 100 Changes</h2></div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>When</th><th>User</th><th>Action</th><th>Table</th><th>Record</th></tr></thead>
                    <tbody>${logs.map(l => `
                        <tr><td>${l.created_at}</td><td>${l.username}</td><td>${l.action}</td><td>${l.table_name||'-'}</td><td>#${l.record_id||'-'}</td></tr>
                    `).join('')}</tbody>
                </table>
            </div>
        </div>`;
}

/* ── SETTINGS ── */
function renderSettings() {
    document.getElementById('content').innerHTML = `
        <div class="card" style="max-width:500px">
            <div class="card-header"><h2>Change Password</h2></div>
            <div class="card-body">
                <div class="form-field"><label>Current Password</label><input type="password" id="pw-current" placeholder="••••••••"></div>
                <div class="form-field"><label>New Password</label><input type="password" id="pw-new" placeholder="Min 8 characters"></div>
                <div class="form-field"><label>Confirm New Password</label><input type="password" id="pw-confirm" placeholder="••••••••"></div>
                <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
            </div>
        </div>`;
}

async function changePassword() {
    const current = document.getElementById('pw-current').value;
    const newPw   = document.getElementById('pw-new').value;
    const confirm = document.getElementById('pw-confirm').value;
    if (newPw !== confirm) { toast('Passwords do not match', 'error'); return; }
    if (newPw.length < 8)  { toast('Minimum 8 characters', 'error'); return; }
    const res = await apiFetch(`${API}/change-password`, { method:'POST', body: JSON.stringify({ current_password: current, new_password: newPw }) });
    if (!res) return;
    const data = await res.json();
    if (!res.ok) { toast(data.error, 'error'); return; }
    toast('Password updated successfully ✓');
}

/* ── AUTO LOGIN IF TOKEN EXISTS ── */
if (TOKEN && currentUser) showApp();
</script>
