<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dynamic World Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

window.THREE = THREE;
window.OrbitControls = OrbitControls;

</script>


  <script type="module">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #ui {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 15px;
      border-radius: 10px;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    #ui button, select {
      margin-top: 6px;
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: none;
      background: #1e90ff;
      color: white;
      cursor: pointer;
    }

    #ui button:hover {
      background: #4aa3ff;
    }

    #info {
      position: fixed;
      bottom: 10px;
      right: 10px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div id="ui">
  <strong>Create Character</strong><br>

  <select id="shape">
    <option value="cube">Cube</option>
    <option value="sphere">Sphere</option>
    <option value="cone">Cone</option>
    <option value="cylinder">Cylinder</option>
  </select>

  <button id="create">Add Character</button>
</div>

<div id="info">Drag objects • Mouse to rotate • Scroll to zoom</div>

<script>
// ========================
// BASIC SETUP
// ========================

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87ceeb, 50, 400);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(40, 30, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ========================
// CONTROLS
// ========================

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.1;
controls.target.set(0, 0, 0);

// ========================
// LIGHTING
// ========================

const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xffffff, 1);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
scene.add(sunLight);

const moonLight = new THREE.DirectionalLight(0x88aaff, 0.2);
scene.add(moonLight);

// ========================
// GROUND (WAVING GRASS)
// ========================

const groundGeo = new THREE.PlaneGeometry(300, 300, 100, 100);

const groundMat = new THREE.MeshStandardMaterial({
  color: 0x3c8c3c,
  roughness: 0.8,
});

const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Save vertices
const grassVertices = ground.geometry.attributes.position.array;

// ========================
// MOUNTAINS
// ========================

function createMountains() {
  const group = new THREE.Group();

  for (let i = 0; i < 40; i++) {
    const geo = new THREE.ConeGeometry(
      3 + Math.random() * 8,
      10 + Math.random() * 30,
      6
    );

    const mat = new THREE.MeshStandardMaterial({
      color: 0x666666,
      roughness: 1
    });

    const m = new THREE.Mesh(geo, mat);

    const angle = Math.random() * Math.PI * 2;
    const dist = 120 + Math.random() * 60;

    m.position.set(
      Math.cos(angle) * dist,
      geo.parameters.height / 2,
      Math.sin(angle) * dist
    );

    m.castShadow = true;
    m.receiveShadow = true;

    group.add(m);
  }

  scene.add(group);
}

createMountains();

// ========================
// SKY
// ========================

const skyGeo = new THREE.SphereGeometry(500, 32, 32);
const skyMat = new THREE.MeshBasicMaterial({
  color: 0x87ceeb,
  side: THREE.BackSide
});

const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ========================
// CHARACTERS
// ========================

const characters = [];

function createCharacter(type) {
  let geo;

  switch (type) {
    case 'sphere':
      geo = new THREE.SphereGeometry(1.5, 32, 32);
      break;
    case 'cone':
      geo = new THREE.ConeGeometry(1.5, 3, 16);
      break;
    case 'cylinder':
      geo = new THREE.CylinderGeometry(1.2, 1.2, 3, 16);
      break;
    default:
      geo = new THREE.BoxGeometry(2, 2, 2);
  }

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6)
  });

  const mesh = new THREE.Mesh(geo, mat);

  mesh.position.set(
    (Math.random() - 0.5) * 30,
    2,
    (Math.random() - 0.5) * 30
  );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);
  characters.push(mesh);
}

// ========================
// UI EVENTS
// ========================

const createBtn = document.getElementById('create');
const shapeSelect = document.getElementById('shape');

createBtn.addEventListener('click', () => {
  createCharacter(shapeSelect.value);
});

// ========================
// DRAG SYSTEM
// ========================

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let selected = null;
let plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let intersection = new THREE.Vector3();

window.addEventListener('pointerdown', e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(characters);

  if (hits.length > 0) {
    selected = hits[0].object;
    controls.enabled = false;
  }
});

window.addEventListener('pointermove', e => {
  if (!selected) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  raycaster.ray.intersectPlane(plane, intersection);

  selected.position.copy(intersection);
  selected.position.y = 2;
});

window.addEventListener('pointerup', () => {
  selected = null;
  controls.enabled = true;
});

// ========================
// DAY / NIGHT CYCLE (SPAIN TIME)
// ========================

function updateDayNight() {

  const now = new Date();

  const spainTime = new Date(
    now.toLocaleString('en-US', { timeZone: 'Europe/Madrid' })
  );

  const hours = spainTime.getHours() + spainTime.getMinutes() / 60;
  const t = hours / 24;

  const angle = t * Math.PI * 2;

  const sunY = Math.sin(angle) * 50;
  const sunX = Math.cos(angle) * 50;

  sunLight.position.set(sunX, sunY, 0);
  moonLight.position.set(-sunX, -sunY, 0);

  const daylight = Math.max(0, Math.sin(angle));

  sunLight.intensity = daylight * 1.2;
  moonLight.intensity = (1 - daylight) * 0.3;

  const dayColor = new THREE.Color(0x87ceeb);
  const nightColor = new THREE.Color(0x020924);

  sky.material.color.lerpColors(nightColor, dayColor, daylight);
}

// ========================
// ANIMATION LOOP
// ========================

let clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  // Grass movement
  const pos = ground.geometry.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);

    const wave = Math.sin(t * 1.5 + x * 0.1 + z * 0.1) * 0.4;

    pos.setY(i, wave);
  }

  pos.needsUpdate = true;
  ground.geometry.computeVertexNormals();

  updateDayNight();

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ========================
// RESPONSIVE
// ========================

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
