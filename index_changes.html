<!--
================================================================
WEST YORKSHIRE CARPETS — index.html Integration Changes
================================================================
Only TWO small changes are needed in your existing index.html.
The rest of the page is completely unchanged.
================================================================


CHANGE 1 — Add GDPR consent checkbox and honeypot field to form
================================================================
Find this in your form (around line 362):

    <button type="submit" class="btn-primary btn-submit">

Insert the following TWO blocks BEFORE that button:
-->

                    <!-- GDPR Consent — required for GDPR Article 7 compliance -->
                    <!-- Remove if your privacy policy covers this via legitimate interest -->
                    <div class="form-group form-group--consent">
                        <label class="checkbox-label" for="f-consent">
                            <input type="checkbox" id="f-consent" name="f-consent">
                            <span class="checkmark"></span>
                            <span>
                                I agree to be contacted by West Yorkshire Carpets regarding my enquiry.
                                View our <a href="/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>.
                            </span>
                        </label>
                    </div>

                    <!--
                        HONEYPOT anti-spam field.
                        Hidden from real users via CSS (do NOT use display:none — some bots detect that).
                        Bots fill it automatically; any submission with a value is silently discarded.
                    -->
                    <div class="honeypot-field" aria-hidden="true" tabindex="-1">
                        <label for="f-website">Leave this field blank</label>
                        <input type="text"
                               id="f-website"
                               name="website"
                               autocomplete="off"
                               tabindex="-1">
                    </div>

<!--
CHANGE 2 — Add script tag for form handler
================================================================
Find at the bottom of your <body>, after the existing:

    <script src="./js/script.js"></script>

Add the new form handler script directly below it:
-->

    <script src="./js/form-handler.js"></script>

<!--
================================================================
CSS to add to styles.css (or a new form-additions.css)
================================================================
-->

<style>
/* ── GDPR consent checkbox in contact form ── */
.form-group--consent {
    margin-top: 4px;
}

.form-group--consent .checkbox-label {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--grey);
    line-height: 1.55;
}

.form-group--consent .checkbox-label input {
    display: none;
}

.form-group--consent .checkmark {
    width: 18px;
    height: 18px;
    border: 2px solid var(--grey-light);
    border-radius: 3px;
    flex-shrink: 0;
    position: relative;
    transition: all var(--transition);
    background: var(--cream);
    margin-top: 1px;
}

.form-group--consent .checkbox-label input:checked ~ .checkmark {
    background: var(--red);
    border-color: var(--red);
}

.form-group--consent .checkbox-label input:checked ~ .checkmark::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1px;
    width: 6px;
    height: 10px;
    border: 2px solid white;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
}

.form-group--consent a {
    color: var(--red);
    font-weight: 500;
}

/* ── Honeypot: visually hidden but NOT display:none ── */
.honeypot-field {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
}
</style>
